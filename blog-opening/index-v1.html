<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Opening</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;overflow:hidden;background:#050505;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:20px;left:20px;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1px;opacity:0.7;pointer-events:none;text-shadow:0 0 8px rgba(255,255,255,0.5)}
#subtitle{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fff;font-size:28px;white-space:nowrap;pointer-events:none;text-shadow:0 0 12px rgba(255,255,255,0.6)}
#music{position:fixed;top:20px;right:20px;width:32px;height:32px;border-radius:50%;background:rgba(245,166,35,0.2);color:#f5a623;font-size:18px;display:none;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(245,166,35,0.4);transition:all 0.3s}
#music:hover{background:rgba(245,166,35,0.4);transform:scale(1.1)}
#music.off{opacity:0.3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="subtitle"></div>
<div id="music">♪</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const hudEl=document.getElementById('hud');
const subEl=document.getElementById('subtitle');
const musicEl=document.getElementById('music');

let W,H,dpr;
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;
  H=window.innerHeight;
  c.width=W*dpr;
  c.height=H*dpr;
  ctx.scale(dpr,dpr);
}
resize();
window.addEventListener('resize',resize);

function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  }
}
const rng=mulberry32(12345);

const X={
  rnd:rng,
  lerp:(a,b,k)=>a+(b-a)*k,
  ease:k=>k<0.5?4*k*k*k:(k-1)*(2*k-2)*(2*k-2)+1,
  glow:(color,blur)=>{
    ctx.shadowColor=color;
    ctx.shadowBlur=blur;
  },
  line:(x1,y1,x2,y2)=>{
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  },
  txt:(s,x,y,size,color,align='center',spacing=0)=>{
    ctx.fillStyle=color;
    ctx.textAlign=align;
    ctx.textBaseline='middle';
    ctx.font=`${size}px ui-monospace,Menlo,Consolas,"Noto Sans SC","PingFang SC","Microsoft YaHei",monospace`;
    if(spacing===0){
      ctx.fillText(s,x,y);
    }else{
      const chars=s.split('');
      const totalW=(chars.length-1)*spacing+chars.reduce((sum,ch)=>sum+ctx.measureText(ch).width,0);
      let ox=align==='center'?x-totalW/2:x;
      chars.forEach(ch=>{
        const w=ctx.measureText(ch).width;
        ctx.fillText(ch,ox+w/2,y);
        ox+=w+spacing;
      });
    }
  },
  pulse:(t,speed=1)=>(Math.sin(t*speed*Math.PI*2)*0.5+0.5)
};

const SCENES=[];

SCENES.push({
  id:'01',
  title:'NEURAL',
  sub:'什么是 AI？',
  t0:0,
  t1:6,
  draw(t,ctx,W,H,X){
    const lt=t-this.t0;
    const dur=this.t1-this.t0;
    const nodes=40;
    const positions=[];
    const cx=W/2,cy=H/2;
    const R=Math.min(W,H)*0.3;
    for(let i=0;i<nodes;i++){
      const angle=X.rnd()*Math.PI*2;
      const r=X.rnd()*R;
      positions.push({x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r});
    }
    const fadeIn=Math.min(1,lt/1);
    ctx.globalAlpha*=fadeIn;
    const connections=[];
    for(let i=0;i<nodes;i++){
      for(let j=i+1;j<nodes;j++){
        const dx=positions[i].x-positions[j].x;
        const dy=positions[i].y-positions[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<R*0.6&&X.rnd()<0.15){
          connections.push([i,j]);
        }
      }
    }
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=0.8;
    X.glow('#fff',4);
    connections.forEach(([i,j])=>{
      const p1=positions[i],p2=positions[j];
      const pulse=X.pulse(lt*2+(i+j)*0.1);
      const alpha=0.3+pulse*0.3;
      ctx.globalAlpha=fadeIn*alpha;
      X.line(p1.x,p1.y,p2.x,p2.y);
    });
    X.glow('',0);
    positions.forEach((p,i)=>{
      const pulse=X.pulse(lt*1.5+i*0.2);
      const size=3+pulse*2;
      const alpha=0.6+pulse*0.4;
      ctx.fillStyle=i===0?'#f5a623':`rgba(255,255,255,${alpha})`;
      X.glow(i===0?'#f5a623':'#fff',i===0?12:6);
      ctx.beginPath();
      ctx.arc(p.x,p.y,size,0,Math.PI*2);
      ctx.fill();
    });
    X.glow('',0);
    ctx.globalAlpha=1;
  }
});

SCENES.push({
  id:'02',
  title:'CLASSROOM',
  sub:'AI 赋能教育',
  t0:6,
  t1:12,
  draw(t,ctx,W,H,X){
    const lt=t-this.t0;
    const dur=this.t1-this.t0;
    const fadeIn=Math.min(1,lt/0.8);
    ctx.globalAlpha*=fadeIn;
    const boardW=W*0.6,boardH=H*0.4;
    const bx=(W-boardW)/2,by=H*0.15;
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=2;
    ctx.strokeRect(bx,by,boardW,boardH);
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='24px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign='center';
    const formula='f(x) = wx + b';
    const formAlpha=Math.min(1,(lt-1)/1);
    ctx.globalAlpha=fadeIn*formAlpha*0.5;
    X.glow('#fff',6);
    ctx.fillText(formula,W/2,by+boardH/2);
    X.glow('',0);
    ctx.globalAlpha=fadeIn;
    const teacherX=W*0.25,teacherY=H*0.7;
    ctx.fillStyle='#f5a623';
    X.glow('#f5a623',12);
    ctx.beginPath();
    ctx.arc(teacherX,teacherY,6,0,Math.PI*2);
    ctx.fill();
    X.glow('',0);
    const students=9;
    const studentPositions=[];
    const startX=W*0.55,startY=H*0.6;
    const cols=3,rows=3;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        studentPositions.push({x:startX+c*60,y:startY+r*60});
      }
    }
    const rayPhase=lt*2;
    studentPositions.forEach((sp,i)=>{
      const delay=i*0.3;
      const rayProgress=Math.max(0,Math.min(1,(rayPhase-delay)/1));
      if(rayProgress>0){
        const ex=X.lerp(teacherX,sp.x,X.ease(rayProgress));
        const ey=X.lerp(teacherY,sp.y,X.ease(rayProgress));
        ctx.strokeStyle='rgba(245,166,35,0.6)';
        ctx.lineWidth=1;
        X.glow('#f5a623',6);
        X.line(teacherX,teacherY,ex,ey);
        X.glow('',0);
      }
      const litUp=rayPhase>i*0.3+1;
      if(litUp){
        const pulse=X.pulse(lt*2+i*0.15);
        const alpha=0.7+pulse*0.3;
        ctx.fillStyle=`rgba(255,255,255,${alpha})`;
        X.glow('#fff',6);
        ctx.beginPath();
        ctx.arc(sp.x,sp.y,4,0,Math.PI*2);
        ctx.fill();
        X.glow('',0);
      }
    });
    ctx.globalAlpha=1;
  }
});

SCENES.push({
  id:'03',
  title:'MAKER',
  sub:'AI 创客 · 动手创造',
  t0:12,
  t1:18,
  draw(t,ctx,W,H,X){
    const lt=t-this.t0;
    const dur=this.t1-this.t0;
    const fadeIn=Math.min(1,lt/0.8);
    ctx.globalAlpha*=fadeIn;
    const cx=W/2,cy=H/2;
    const r1=80,r2=100;
    const teeth=12;
    const rot1=lt*0.3;
    const rot2=-lt*0.3;
    function drawGear(cx,cy,r,teeth,rot){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rot);
      ctx.strokeStyle='rgba(255,255,255,0.6)';
      ctx.lineWidth=2;
      X.glow('#fff',4);
      ctx.beginPath();
      for(let i=0;i<=teeth*2;i++){
        const angle=i*Math.PI/teeth;
        const rr=i%2===0?r:r*0.85;
        const x=Math.cos(angle)*rr;
        const y=Math.sin(angle)*rr;
        if(i===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.stroke();
      X.glow('',0);
      ctx.restore();
    }
    drawGear(cx-70,cy,r1,teeth,rot1);
    drawGear(cx+70,cy,r2,teeth,rot2);
    const lines=8;
    const circuitProgress=Math.min(1,(lt-0.5)/2);
    for(let i=0;i<lines;i++){
      const angle=(i/lines)*Math.PI*2;
      const startDist=Math.min(W,H)*0.4;
      const sx=cx+Math.cos(angle)*startDist;
      const sy=cy+Math.sin(angle)*startDist;
      const progress=X.ease(circuitProgress);
      const ex=X.lerp(sx,cx,progress);
      const ey=X.lerp(sy,cy,progress);
      ctx.strokeStyle='rgba(245,166,35,0.5)';
      ctx.lineWidth=1;
      X.glow('#f5a623',3);
      X.line(sx,sy,ex,ey);
      X.glow('',0);
    }
    const codeChars=['0','1','{','}','<','>'];
    const codeFlow=lt*60;
    const codeY=cy-140;
    for(let i=0;i<10;i++){
      const xOff=(i*40+codeFlow)%(W+100)-50;
      const ch=codeChars[Math.floor((i+lt*2)%codeChars.length)];
      const alpha=0.4+X.pulse(lt+i*0.5)*0.2;
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;
      ctx.font='14px ui-monospace,Menlo,Consolas,monospace';
      ctx.textAlign='center';
      ctx.fillText(ch,xOff,codeY);
    }
    const bulbLit=lt>3;
    if(bulbLit){
      const bulbX=cx,bulbY=cy+130;
      ctx.strokeStyle='rgba(255,255,255,0.7)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(bulbX,bulbY-10,15,0.2*Math.PI,0.8*Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bulbX-8,bulbY+8);
      ctx.lineTo(bulbX+8,bulbY+8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bulbX-6,bulbY+12);
      ctx.lineTo(bulbX+6,bulbY+12);
      ctx.stroke();
      const pulse=X.pulse(lt*3);
      const glowStr=0.6+pulse*0.4;
      ctx.fillStyle=`rgba(245,166,35,${glowStr})`;
      X.glow('#f5a623',20);
      ctx.beginPath();
      ctx.arc(bulbX,bulbY-10,12,0,Math.PI*2);
      ctx.fill();
      X.glow('',0);
    }
    ctx.globalAlpha=1;
  }
});

SCENES.push({
  id:'04',
  title:'AGENTS',
  sub:'未来的 AI 智能体',
  t0:18,
  t1:24,
  draw(t,ctx,W,H,X){
    const lt=t-this.t0;
    const dur=this.t1-this.t0;
    const fadeIn=Math.min(1,lt/0.8);
    ctx.globalAlpha*=fadeIn;
    const agents=6;
    if(!this.agentData){
      this.agentData=[];
      for(let i=0;i<agents;i++){
        this.agentData.push({
          x:X.rnd()*W,
          y:X.rnd()*H,
          vx:(X.rnd()-0.5)*30,
          vy:(X.rnd()-0.5)*30,
          trail:[]
        });
      }
      this.tasks=[];
    }
    const dt=0.016;
    this.agentData.forEach(ag=>{
      ag.x+=ag.vx*dt;
      ag.y+=ag.vy*dt;
      if(ag.x<50||ag.x>W-50)ag.vx*=-1;
      if(ag.y<50||ag.y>H-50)ag.vy*=-1;
      ag.x=Math.max(50,Math.min(W-50,ag.x));
      ag.y=Math.max(50,Math.min(H-50,ag.y));
      ag.trail.push({x:ag.x,y:ag.y,t:lt});
      ag.trail=ag.trail.filter(p=>lt-p.t<1);
    });
    if(X.rnd()<0.03&&this.tasks.length<3){
      const from=Math.floor(X.rnd()*agents);
      let to=Math.floor(X.rnd()*agents);
      while(to===from)to=Math.floor(X.rnd()*agents);
      this.tasks.push({from,to,t0:lt,dur:1.5});
    }
    this.tasks=this.tasks.filter(tk=>lt-tk.t0<tk.dur);
    this.agentData.forEach(ag=>{
      ag.trail.forEach((p,i)=>{
        const age=lt-p.t;
        const alpha=(1-age)*0.3;
        ctx.fillStyle=`rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,1,0,Math.PI*2);
        ctx.fill();
      });
    });
    this.tasks.forEach(tk=>{
      const progress=Math.min(1,(lt-tk.t0)/tk.dur);
      const from=this.agentData[tk.from];
      const to=this.agentData[tk.to];
      const bx=X.lerp(from.x,to.x,X.ease(progress));
      const by=X.lerp(from.y,to.y,X.ease(progress));
      ctx.fillStyle='#f5a623';
      X.glow('#f5a623',10);
      ctx.beginPath();
      ctx.arc(bx,by,4,0,Math.PI*2);
      ctx.fill();
      X.glow('',0);
      if(progress<0.1||progress>0.9){
        ctx.strokeStyle='rgba(245,166,35,0.6)';
        ctx.lineWidth=1;
        X.glow('#f5a623',4);
        X.line(from.x,from.y,to.x,to.y);
        X.glow('',0);
      }
    });
    this.agentData.forEach((ag,i)=>{
      const pulse=X.pulse(lt*2+i*0.3);
      const size=5+pulse*2;
      ctx.fillStyle='rgba(255,255,255,0.9)';
      X.glow('#fff',8);
      ctx.beginPath();
      ctx.arc(ag.x,ag.y,size,0,Math.PI*2);
      ctx.fill();
      X.glow('',0);
    });
    ctx.globalAlpha=1;
  }
});

const T0=parseFloat(new URLSearchParams(location.search).get('t')||'0');
const startMs=performance.now();
let t=T0;
let replayShift=0;
window.__doReplay=function(){replayShift=performance.now()-startMs;};

window.__onFirstGesture=[];
let gestured=false;
let musicOn=true;

function onGesture(){
  if(gestured)return;
  gestured=true;
  musicEl.style.display='flex';
  window.__onFirstGesture.forEach(fn=>fn());
}
document.addEventListener('pointerdown',onGesture,{once:true});
document.addEventListener('keydown',onGesture,{once:true});

musicEl.addEventListener('click',()=>{
  if(window.__toggleMute) window.__toggleMute();
  musicEl.classList.toggle('off');
});

function findActiveScenes(t){
  return SCENES.filter(sc=>t>=sc.t0-0.8&&t<=sc.t1+0.8);
}

function sceneAlpha(sc,t){
  const fadeInDur=0.8,fadeOutDur=0.8;
  if(t<sc.t0){
    return Math.max(0,(t-(sc.t0-fadeInDur))/fadeInDur);
  }else if(t>sc.t1){
    return Math.max(0,1-(t-sc.t1)/fadeOutDur);
  }
  return 1;
}

function render(){
  t=Math.min(40,T0+(performance.now()-startMs-replayShift)/1000);
  window.__t=t;
  ctx.fillStyle='#050505';
  ctx.fillRect(0,0,W,H);
  const active=findActiveScenes(t);
  active.forEach(sc=>{
    const alpha=sceneAlpha(sc,t);
    if(alpha<=0)return;
    ctx.save();
    ctx.globalAlpha=alpha;
    sc.draw(t,ctx,W,H,X);
    ctx.restore();
  });
  const current=SCENES.find(sc=>t>=sc.t0&&t<sc.t1);
  if(current){
    hudEl.textContent=`SCENE ${current.id} · ${current.title}\nT+${t.toFixed(1)}S`;
    const subAlpha=sceneAlpha(current,t);
    subEl.style.opacity=subAlpha;
    subEl.textContent=current.sub;
  }else{
    hudEl.textContent=`T+${t.toFixed(1)}S`;
    subEl.style.opacity=0;
  }
  requestAnimationFrame(render);
}
render();

SCENES.push({
  id: '05',
  title: 'KNOWLEDGE',
  t0: 24,
  t1: 30,
  sub: '知识库 · 有问即答',
  draw(t, ctx, W, H, X) {
    const local = t - this.t0;
    const dur = this.t1 - this.t0;
    
    // 中央立方体尺寸
    const cubeSize = 80;
    const cx = W / 2;
    const cy = H / 2;
    const rot = local * 0.3;
    
    // 旋转立方体顶点
    const angle = rot;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    
    function rotate(x, y) {
      return [x * cos - y * sin, x * sin + y * cos];
    }
    
    // 绘制线框立方体
    ctx.save();
    ctx.translate(cx, cy);
    X.glow('#f5a623', 8);
    ctx.strokeStyle = '#f5a623';
    ctx.lineWidth = 1.5;
    
    const vertices = [];
    for (let i = 0; i < 8; i++) {
      const x = (i & 1 ? 1 : -1) * cubeSize / 2;
      const y = (i & 2 ? 1 : -1) * cubeSize / 2;
      const z = (i & 4 ? 1 : -1) * cubeSize / 2;
      const [rx, ry] = rotate(x, y);
      const [rx2, rz] = rotate(rx, z);
      vertices.push([rx2, ry, rz]);
    }
    
    // 简单透视投影
    const edges = [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],[0,4],[1,5],[2,6],[3,7]];
    edges.forEach(([a, b]) => {
      const [x1, y1, z1] = vertices[a];
      const [x2, y2, z2] = vertices[b];
      const scale1 = 200 / (200 + z1);
      const scale2 = 200 / (200 + z2);
      ctx.beginPath();
      ctx.moveTo(x1 * scale1, y1 * scale1);
      ctx.lineTo(x2 * scale2, y2 * scale2);
      ctx.stroke();
    });
    
    ctx.restore();
    
    // 数据粒子汇入
    const particleCount = 120;
    X.glow('#fff', 3);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < particleCount; i++) {
      const seed = i * 0.618;
      const phase = (local + seed) % dur;
      const progress = X.ease(Math.min(phase / 2, 1));
      
      const startAngle = seed * Math.PI * 2;
      const startDist = 600;
      const startX = cx + Math.cos(startAngle) * startDist;
      const startY = cy + Math.sin(startAngle) * startDist;
      
      const px = X.lerp(startX, cx, progress);
      const py = X.lerp(startY, cy, progress);
      
      if (progress < 0.95) {
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // 检索光束与答案
    const beamInterval = 2;
    const beamIndex = Math.floor(local / beamInterval);
    const beamT = (local % beamInterval) / beamInterval;
    
    if (beamT < 0.6 && local > 0.5) {
      const beamSeed = beamIndex * 0.789;
      const targetX = cx + 250 + Math.cos(beamSeed * 10) * 100;
      const targetY = cy - 200 + Math.sin(beamSeed * 15) * 80;
      
      const progress = X.ease(beamT / 0.6);
      const bx = X.lerp(cx, targetX, progress);
      const by = X.lerp(cy, targetY, progress);
      
      X.glow('#f5a623', 6);
      ctx.strokeStyle = '#f5a623';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(bx, by);
      ctx.stroke();
      
      if (progress > 0.95) {
        X.glow('#f5a623', 12);
        ctx.fillStyle = '#f5a623';
        ctx.beginPath();
        ctx.arc(targetX, targetY, 8, 0, Math.PI * 2);
        ctx.fill();
        
        X.txt('FOUND', targetX, targetY - 15, 10, '#f5a623', 'center', 1);
      }
    }
  }
});

SCENES.push({
  id: '06',
  title: 'GRAPH',
  t0: 30,
  t1: 35,
  sub: '连接知识',
  draw(t, ctx, W, H, X) {
    const local = t - this.t0;
    const dur = this.t1 - this.t0;
    
    const cx = W / 2;
    const cy = H / 2;
    const breathe = 1 + Math.sin(local * 1.5) * 0.08;
    const rotation = local * 0.15;
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.scale(breathe, breathe);
    
    // 节点数据：[层级, 角度偏移, 标签]
    const nodes = [
      [0, 0, '知识中心'],
      [1, 0, '机器学习'],
      [1, 2.09, '教育'],
      [1, 4.19, '创客'],
      [2, -0.5, '神经网络'],
      [2, 0.5, '深度学习'],
      [2, 1.8, '在线课程'],
      [2, 2.4, '课程设计'],
      [2, 3.9, '硬件'],
      [2, 4.5, '开源'],
      [3, -0.7, '卷积网络'],
      [3, 0.3, '生成模型'],
      [3, 1.6, '视频'],
      [3, 2.2, '互动'],
      [3, 3.7, '树莓派'],
      [3, 4.7, '社区']
    ];
    
    const layerRadius = [0, 120, 200, 280];
    const nodePos = [];
    
    nodes.forEach(([layer, angle, label], idx) => {
      const r = layerRadius[layer];
      const progress = X.ease(Math.min((local - layer * 0.3) / 0.8, 1));
      const currentR = r * progress;
      const x = Math.cos(angle) * currentR;
      const y = Math.sin(angle) * currentR;
      nodePos.push([x, y, layer, label, progress]);
    });
    
    // 绘制连线
    X.glow('#f5a623', 4);
    ctx.strokeStyle = 'rgba(245,166,35,0.4)';
    ctx.lineWidth = 1;
    
    nodePos.forEach(([x, y, layer, label, progress], idx) => {
      if (layer > 0 && progress > 0.5) {
        const parentLayer = layer - 1;
        nodePos.forEach(([px, py, pl], pidx) => {
          if (pl === parentLayer) {
            const dist = Math.hypot(x - px, y - py);
            if (dist < layerRadius[layer] - layerRadius[parentLayer] + 50) {
              ctx.beginPath();
              ctx.moveTo(px, py);
              ctx.lineTo(x, y);
              ctx.stroke();
            }
          }
        });
      }
    });
    
    // 绘制节点
    nodePos.forEach(([x, y, layer, label, progress]) => {
      if (progress > 0) {
        const size = layer === 0 ? 12 : 6;
        X.glow(layer === 0 ? '#f5a623' : '#fff', layer === 0 ? 8 : 4);
        ctx.fillStyle = layer === 0 ? '#f5a623' : '#fff';
        ctx.beginPath();
        ctx.arc(x, y, size * progress, 0, Math.PI * 2);
        ctx.fill();
        
        if (progress > 0.8) {
          const fontSize = layer === 0 ? 14 : 11;
          const color = layer === 0 ? '#f5a623' : '#ccc';
          X.txt(label, x, y + size + 16, fontSize, color, 'center', 0.5);
        }
      }
    });
    
    ctx.restore();
  }
});

SCENES.push({
  id: '07',
  title: 'IDENTITY',
  t0: 35,
  t1: 40,
  sub: '',
  draw(t, ctx, W, H, X) {
    const local = t - this.t0;
    const cx = W / 2;
    const cy = H / 2;
    
    // 线条汇聚与扩散
    if (local < 2) {
      const lineCount = 60;
      const progress = X.ease(local / 2);
      X.glow('#fff', 4);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      
      for (let i = 0; i < lineCount; i++) {
        const angle = (i / lineCount) * Math.PI * 2;
        const startDist = 500;
        const endDist = progress < 0.5 ? X.lerp(startDist, 0, progress * 2) : X.lerp(0, 600, (progress - 0.5) * 2);
        
        const x = cx + Math.cos(angle) * endDist;
        const y = cy + Math.sin(angle) * endDist;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.globalAlpha = 1 - progress * 0.5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    
    // 光环
    if (local > 1.5) {
      const ringProgress = Math.min((local - 1.5) / 1, 1);
      const ringRadius = 150 * X.ease(ringProgress);
      X.glow('#f5a623', 12);
      ctx.strokeStyle = '#f5a623';
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    
    // 主标题
    if (local > 2) {
      const titleProgress = Math.min((local - 2) / 0.8, 1);
      const scale = X.ease(titleProgress);
      ctx.globalAlpha = scale;
      
      X.glow('#f5a623', 16);
      X.txt('张老师 TV', cx, cy - 20, 72 * scale, '#f5a623', 'center', 2);
      
      if (titleProgress > 0.5) {
        X.glow('#ccc', 4);
        X.txt('AI · 教育 · 未来', cx, cy + 50, 18, '#999', 'center', 4);
      }
      
      ctx.globalAlpha = 1;
    }
  }
});

// ============================================================
// B. Web Audio 生成式轻音乐
// ============================================================

let audioCtx = null;
let masterGain = null;
let isMuted = false;
let isAudioStarted = false;

window.__toggleMute = function() {
  if (!audioCtx || !masterGain) return;
  isMuted = !isMuted;
  masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.14, audioCtx.currentTime, 0.1);
};

window.__onFirstGesture.push(function() {
  if (isAudioStarted) return;
  isAudioStarted = true;
  
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    
    audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.14;
    
    // Delay 节点
    const delay = audioCtx.createDelay();
    delay.delayTime.value = 0.3;
    const delayFeedback = audioCtx.createGain();
    delayFeedback.gain.value = 0.25;
    const delayWet = audioCtx.createGain();
    delayWet.gain.value = 0.2;
    
    delay.connect(delayFeedback);
    delayFeedback.connect(delay);
    delay.connect(delayWet);
    delayWet.connect(masterGain);
    
    masterGain.connect(audioCtx.destination);
    
    // Pad 和弦
    const chords = [
      [220, 261.63, 329.63], // Am
      [174.61, 220, 261.63], // F
      [130.81, 164.81, 196],  // C
      [196, 246.94, 293.66]   // G
    ];
    
    function playPad() {
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;
      const chordIndex = Math.floor((now / 8) % chords.length);
      const chord = chords[chordIndex];
      
      chord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 2);
        gain.gain.setValueAtTime(0.08, now + 6);
        gain.gain.linearRampToValueAtTime(0, now + 8);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        gain.connect(delay);
        
        osc.start(now);
        osc.stop(now + 8);
      });
      
      setTimeout(playPad, 8000);
    }
    
    playPad();
    
    // 五声音阶拨弦
    const pentatonic = [440, 523.25, 587.33, 659.25, 783.99, 880];
    let pluckSeed = 0.123;
    
    function seededRandom() {
      pluckSeed = (pluckSeed * 9301 + 49297) % 233280;
      return pluckSeed / 233280;
    }
    
    function playPluck() {
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;
      const freq = pentatonic[Math.floor(seededRandom() * pentatonic.length)];
      
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
      
      osc.connect(gain);
      gain.connect(masterGain);
      gain.connect(delay);
      
      osc.start(now);
      osc.stop(now + 1.8);
      
      const nextDelay = 1200 + seededRandom() * 1300;
      setTimeout(playPluck, nextDelay);
    }
    
    playPluck();
    
  } catch (e) {
    // 静默降级
  }
});
